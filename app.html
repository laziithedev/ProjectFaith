<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Faith | Analyzer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #05050d;
      --bg-secondary: #0b0b18;
      --glass-bg: rgba(12, 12, 28, 0.72);
      --glass-border: rgba(0, 245, 255, 0.12);
      --glass-border-hover: rgba(0, 245, 255, 0.35);
      --cyan: #00f5ff;
      --cyan-dim: rgba(0, 245, 255, 0.15);
      --cyan-glow: rgba(0, 245, 255, 0.4);
      --purple: #a855f7;
      --purple-dim: rgba(168, 85, 247, 0.15);
      --purple-glow: rgba(168, 85, 247, 0.4);
      --red: #ff4757;
      --green: #2ed573;
      --orange: #ffa502;
      --text-primary: #e8e8f0;
      --text-secondary: #8888aa;
      --text-muted: #4a4a6a;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,245,255,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(168,85,247,0.07) 0%, transparent 60%),
        var(--bg-primary);
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 99px; }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0; z-index: 100;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      background: rgba(5, 5, 13, 0.85);
      border-bottom: 1px solid var(--glass-border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .header-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      filter: drop-shadow(0 0 8px rgba(0,245,255,0.45));
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--cyan) 0%, #7dd3fc 50%, var(--purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-back {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 99px;
      transition: color 0.2s, border-color 0.2s;
    }

    .header-back:hover {
      color: var(--cyan);
      border-color: rgba(0,245,255,0.35);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── LIQUID MODE TOGGLE ── */
    .liquid-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .liquid-toggle-label {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      transition: color 0.35s, text-shadow 0.35s;
      user-select: none;
      pointer-events: none;
    }

    .liquid-toggle-label.active {
      color: var(--cyan);
      text-shadow: 0 0 8px rgba(0,245,255,0.5);
    }

    .liquid-toggle {
      --c-active: var(--cyan);
      --c-active-inner: #ffffff;
      --c-default: rgba(255,255,255,0.10);
      --c-default-dark: rgba(255,255,255,0.16);
      position: relative;
      display: block;
      cursor: pointer;
      height: 32px;
      width: 52px;
      flex-shrink: 0;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .liquid-toggle input {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 999px;
      background: var(--c-default);
      border: 1px solid var(--glass-border);
      outline: none;
      transition: background-color 0.5s, border-color 0.5s, box-shadow 0.5s;
    }

    .liquid-toggle input:hover { background: var(--c-default-dark); }

    .liquid-toggle input:checked {
      background: var(--c-active);
      border-color: rgba(0,245,255,0.55);
      box-shadow: 0 0 20px rgba(0,245,255,0.4);
    }

    .liquid-toggle input:focus-visible {
      box-shadow: 0 0 0 2px rgba(0,245,255,0.35), 0 0 18px rgba(0,245,255,0.35);
    }

    .liquid-toggle-svg {
      pointer-events: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      fill: var(--c-active-inner);
      overflow: visible;
    }

    .liquid-toggle-circle {
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .liquid-toggle-drop { animation: liquid-drop 0.7s cubic-bezier(0.4,0,0.2,1) both; }

    @keyframes liquid-drop {
      0%   { transform: translateY(-6px); opacity: 0; }
      55%  { transform: translateY(3px);  opacity: 1; }
      100% { transform: translateY(0);    opacity: 1; }
    }

    .liquid-goo-defs {
      position: fixed;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .fft-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, rgba(0,245,255,0.16), rgba(168,85,247,0.16));
      border: 1px solid rgba(0,245,255,0.38);
      color: var(--cyan);
      margin-left: 4px;
      text-shadow: 0 0 8px rgba(0,245,255,0.4);
    }

    .production-note {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: rgba(255,165,2,0.08);
      border: 1px solid rgba(255,165,2,0.28);
      color: var(--orange);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    /* ── GRADIENT MENU ── */
    .gradient-menu-wrap {
      display: flex;
      justify-content: center;
      padding: 28px 16px 8px;
    }

    .gradient-menu {
      display: flex;
      gap: 14px;
      align-items: center;
      list-style: none;
      padding: 0; margin: 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    .gradient-menu-item {
      position: relative;
      width: 56px; height: 56px;
      background: #fff;
      box-shadow: 0 4px 18px rgba(0,0,0,0.22);
      border-radius: 99px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      overflow: hidden;
      border: none;
      padding: 0;
      font-family: inherit;
      transition: width 0.45s cubic-bezier(0.4,0,0.2,1), box-shadow 0.45s;
    }

    .gradient-menu-item:hover,
    .gradient-menu-item.gm-active { width: 150px; box-shadow: none; }

    .gradient-menu-bg {
      position: absolute; inset: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.45s;
    }

    .gradient-menu-item:hover .gradient-menu-bg,
    .gradient-menu-item.gm-active .gradient-menu-bg { opacity: 1; }

    .gradient-menu-glow {
      position: absolute;
      top: 10px; left: 0; right: 0;
      height: 100%;
      border-radius: inherit;
      filter: blur(15px);
      opacity: 0; z-index: -1;
      transition: opacity 0.45s;
      pointer-events: none;
    }

    .gradient-menu-item:hover .gradient-menu-glow,
    .gradient-menu-item.gm-active .gradient-menu-glow { opacity: 0.5; }

    .gradient-menu-icon {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      color: #6b7280;
      transition: transform 0.35s, opacity 0.25s;
      flex-shrink: 0;
    }

    .gradient-menu-item:hover .gradient-menu-icon,
    .gradient-menu-item.gm-active .gradient-menu-icon { transform: scale(0); opacity: 0; }

    .gradient-menu-label {
      position: absolute;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 12px; font-weight: 700;
      font-family: inherit;
      transform: scale(0); opacity: 0;
      transition: transform 0.3s 0.12s, opacity 0.3s 0.12s;
      white-space: nowrap; z-index: 10;
      pointer-events: none;
    }

    .gradient-menu-item:hover .gradient-menu-label,
    .gradient-menu-item.gm-active .gradient-menu-label { transform: scale(1); opacity: 1; }

    /* ── MAIN LAYOUT ── */
    .main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── GLASS CARD ── */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
    }

    /* ── UPLOAD ZONE ── */
    .upload-section { text-align: center; }

    .upload-hero { margin-bottom: 32px; }

    .upload-hero h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .upload-hero h1 span {
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .upload-hero p {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto;
    }

    .drop-zone {
      border: 2px dashed rgba(0,245,255,0.22);
      border-radius: var(--radius-xl);
      padding: 56px 40px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      background: linear-gradient(145deg, rgba(0,245,255,0.02), rgba(168,85,247,0.02));
      position: relative;
      overflow: hidden;
    }

    .drop-zone::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(0,245,255,0.04) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .drop-zone:hover::before, .drop-zone.drag-over::before { opacity: 1; }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: rgba(0,245,255,0.55);
      background: linear-gradient(145deg, rgba(0,245,255,0.05), rgba(168,85,247,0.04));
      box-shadow: 0 0 40px rgba(0,245,255,0.08), inset 0 0 40px rgba(0,245,255,0.03);
      transform: translateY(-2px);
    }

    .drop-icon {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--cyan-dim), var(--purple-dim));
      border: 1px solid var(--glass-border-hover);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .drop-zone:hover .drop-icon { transform: scale(1.08); box-shadow: 0 0 24px var(--cyan-glow); }

    .drop-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
    .drop-subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }

    .file-type-pills {
      display: flex; gap: 8px; justify-content: center;
      flex-wrap: wrap; margin-bottom: 24px;
    }

    .pill {
      padding: 5px 14px;
      border-radius: 99px;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.05em;
      border: 1px solid;
    }

    .pill-cyan    { color: var(--cyan);           border-color: rgba(0,245,255,0.3);   background: rgba(0,245,255,0.06); }
    .pill-purple  { color: var(--purple);          border-color: rgba(168,85,247,0.3);  background: rgba(168,85,247,0.06); }
    .pill-neutral { color: var(--text-secondary);  border-color: rgba(136,136,170,0.25); background: rgba(136,136,170,0.05); }

    .upload-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer; border: none;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      background: linear-gradient(135deg, var(--cyan) 0%, #0ea5e9 50%, var(--purple) 100%);
      color: #05050d;
      box-shadow: 0 4px 24px rgba(0,245,255,0.25);
    }

    .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,245,255,0.38); }
    .upload-btn:active { transform: translateY(0); }

    .upload-counter {
      margin-top: 28px; color: var(--text-muted); font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .counter-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }

    #file-input { display: none; }

    /* ── SCANNING ── */
    .scan-panel { padding: 64px 40px; text-align: center; position: relative; overflow: hidden; }

    .scan-spinner-wrap { position: relative; width: 120px; height: 120px; margin: 0 auto 32px; }

    .scan-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: spin-ring 1.4s linear infinite;
    }

    .scan-ring-1 { border-top-color: var(--cyan); border-right-color: var(--cyan); box-shadow: 0 0 16px var(--cyan-glow); }
    .scan-ring-2 { inset: 12px; border-bottom-color: var(--purple); border-left-color: var(--purple); animation-duration: 1.1s; animation-direction: reverse; box-shadow: inset 0 0 12px var(--purple-glow); }
    .scan-ring-3 { inset: 24px; border-top-color: rgba(0,245,255,0.5); animation-duration: 0.8s; }

    .scan-icon-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; }

    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .scan-title {
      font-size: 22px; font-weight: 800; margin-bottom: 8px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .scan-subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }

    .scan-progress-track { height: 3px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; max-width: 300px; margin: 0 auto 16px; }

    .scan-progress-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      box-shadow: 0 0 8px var(--cyan-glow);
      animation: scan-progress 2.2s cubic-bezier(0.4,0,0.2,1) forwards;
    }

    @keyframes scan-progress { 0% { width: 0%; } 40% { width: 55%; } 70% { width: 75%; } 100% { width: 100%; } }

    .scan-steps { display: flex; flex-direction: column; gap: 8px; max-width: 260px; margin: 0 auto; }

    .scan-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); transition: color 0.4s; text-align: left; }
    .scan-step.active { color: var(--cyan); }
    .scan-step.done   { color: var(--text-secondary); }

    .step-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; transition: background 0.4s, box-shadow 0.4s; }
    .scan-step.active .step-dot { background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); animation: pulse-dot 1s ease-in-out infinite; }
    .scan-step.done   .step-dot { background: var(--green); }

    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .scanline {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 12px var(--cyan-glow);
      animation: scanline-move 1.8s ease-in-out infinite;
      opacity: 0.6;
    }

    @keyframes scanline-move { 0% { top: 0; opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { top: 100%; opacity: 0; } }

    /* ── RESULTS ── */
    .results-panel { padding: 36px; }

    .results-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 32px; gap: 20px; flex-wrap: wrap; }

    .results-verdict { display: flex; align-items: center; gap: 14px; }

    .verdict-badge { padding: 6px 16px; border-radius: 99px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
    .verdict-ai    { background: rgba(255,71,87,0.12);  color: var(--red);   border: 1px solid rgba(255,71,87,0.35); box-shadow: 0 0 12px rgba(255,71,87,0.15); }
    .verdict-human { background: rgba(46,213,115,0.1);  color: var(--green); border: 1px solid rgba(46,213,115,0.3); box-shadow: 0 0 12px rgba(46,213,115,0.15); }

    .verdict-title    { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .verdict-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }

    .results-timestamp { font-size: 12px; color: var(--text-muted); text-align: right; line-height: 1.6; }

    .results-top-row { display: grid; grid-template-columns: auto 1fr; gap: 28px; margin-bottom: 28px; align-items: center; }

    .gauge-wrap   { display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0; }
    .gauge-label  { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
    .gauge-svg    { overflow: visible; }
    .gauge-track  { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; stroke-linecap: round; }
    .gauge-fill   { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1.6s cubic-bezier(0.4,0,0.2,1); }
    .gauge-center-text  { dominant-baseline: middle; text-anchor: middle; font-family: inherit; font-weight: 800; letter-spacing: -0.02em; }
    .gauge-center-label { dominant-baseline: middle; text-anchor: middle; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--text-secondary); }

    .summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .stat-chip { padding: 16px 18px; border-radius: var(--radius-md); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); transition: border-color 0.2s; }
    .stat-chip:hover { border-color: var(--glass-border-hover); }
    .stat-chip-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .stat-chip-value { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .stat-chip-sub   { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--glass-border), transparent); margin: 28px 0; }

    .metrics-title { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 20px; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .metric-card { padding: 18px 20px; border-radius: var(--radius-md); background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.055); transition: all 0.25s; }
    .metric-card:hover { border-color: var(--glass-border-hover); background: rgba(0,245,255,0.03); transform: translateY(-1px); }

    .metric-top  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
    .metric-name { font-size: 13px; font-weight: 700; line-height: 1.3; flex: 1; }
    .metric-pct  { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; flex-shrink: 0; }
    .metric-desc { font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.4; }
    .metric-bar-track { height: 5px; background: rgba(255,255,255,0.06); border-radius: 99px; overflow: hidden; }
    .metric-bar-fill  { height: 100%; border-radius: 99px; transition: width 1.4s cubic-bezier(0.4,0,0.2,1); }

    .action-area { margin-top: 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .action-info { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .action-info strong { color: var(--text-primary); }

    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 26px; border-radius: 12px;
      font-size: 15px; font-weight: 700; letter-spacing: 0.02em;
      cursor: pointer; border: none;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      background: linear-gradient(135deg, var(--cyan) 0%, #0ea5e9 50%, var(--purple) 100%);
      color: #05050d;
      box-shadow: 0 4px 24px rgba(0,245,255,0.25);
      white-space: nowrap;
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,245,255,0.38); }

    const MENU_TABS = [

        icon: <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
      },
    ];

    /* ── DATA ── */
    const AI_METRICS = [
      { label: 'Pixel Artifact Detection',    pct: 91, desc: 'GAN fingerprints & tiling artifacts found', color: '#ff4757' },
      { label: 'Lighting & Shadow Coherence', pct: 78, desc: 'Inconsistent light source vectors detected', color: '#ffa502' },
      { label: 'Noise Pattern Analysis',      pct: 88, desc: 'Synthetic noise distribution confirmed',     color: '#ff4757' },
      { label: 'Metadata Verification',       pct: 74, desc: 'Camera EXIF data absent or spoofed',         color: '#ffa502' },
    ];

    const HUMAN_METRICS = [
      { label: 'Pixel Artifact Detection',    pct: 9,  desc: 'Natural pixel distribution — no GAN marks', color: '#2ed573' },
      { label: 'Lighting & Shadow Coherence', pct: 14, desc: 'Physically coherent lighting model',         color: '#2ed573' },
      { label: 'Noise Pattern Analysis',      pct: 11, desc: 'Organic sensor noise signature present',     color: '#2ed573' },
      { label: 'Metadata Verification',       pct: 7,  desc: 'Full EXIF metadata chain intact',            color: '#2ed573' },
    ];

    const SCAN_STEPS = [
      'Loading file into analysis engine…',
      'Running deep neural inspection…',
      'Cross-referencing signature database…',
      'Compiling confidence scores…',
    ];

    const PRODUCTION_SCAN_STEPS = [
      'Drawing image to analysis canvas…',
      'Running 2D Fourier Transform…',
      'Extracting spectral features…',
      'Classifying frequency signature…',
    ];

    /* ── FFT ANALYSIS PIPELINE ─────────────────────────────
       Pure client-side frequency-domain analysis. Uses a
       radix-2 Cooley-Tukey FFT applied separably to rows
       then columns, then extracts spectral features to
       discriminate AI-generated from natural images.
    */
    function nextPow2(n) { let p = 1; while (p < n) p *= 2; return p; }

    function fft1d(real, imag) {
      const n = real.length;
      // Bit-reversal permutation
      for (let i = 1, j = 0; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) {
          const tr = real[i]; real[i] = real[j]; real[j] = tr;
          const ti = imag[i]; imag[i] = imag[j]; imag[j] = ti;
        }
      }
      for (let len = 2; len <= n; len <<= 1) {
        const ang = -2 * Math.PI / len;
        const wlR = Math.cos(ang), wlI = Math.sin(ang);
        for (let i = 0; i < n; i += len) {
          let wR = 1, wI = 0;
          const half = len >> 1;
          for (let k = 0; k < half; k++) {
            const aR = real[i+k], aI = imag[i+k];
            const bR = real[i+k+half] * wR - imag[i+k+half] * wI;
            const bI = real[i+k+half] * wI + imag[i+k+half] * wR;
            real[i+k]      = aR + bR; imag[i+k]      = aI + bI;
            real[i+k+half] = aR - bR; imag[i+k+half] = aI - bI;
            const nwR = wR * wlR - wI * wlI;
            wI = wR * wlI + wI * wlR;
            wR = nwR;
          }
        }
      }
    }

    function generateHotspots(quadrant, isAI) {
      // Anchor cluster center in the spatial quadrant matching
      // the dominant spectral quadrant (mirrors where the
      // anomalous energy concentrated).
      const qx = quadrant % 2 === 0 ? 0.28 : 0.72;
      const qy = quadrant < 2       ? 0.28 : 0.72;
      const aiLabels    = ['GAN Fingerprint','Spectral Anomaly','High-Freq Cluster','Frequency Seam','Pixel Artifact'];
      const humanLabels = ['Compression','Lens Artifact','Sensor Noise'];
      const labels = isAI ? aiLabels : humanLabels;
      const count = isAI ? 3 + Math.floor(Math.random() * 3) : 2 + Math.floor(Math.random() * 2);
      const out = [];
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
        const dist  = 0.14 + Math.random() * 0.16;
        out.push({
          x: Math.min(0.92, Math.max(0.08, qx + Math.cos(angle) * dist)),
          y: Math.min(0.92, Math.max(0.08, qy + Math.sin(angle) * dist)),
          r: 0.13 + Math.random() * 0.1,
          intensity: isAI ? 0.7 + Math.random() * 0.22 : 0.14 + Math.random() * 0.1,
          label: labels[i % labels.length],
        });
      }
      return out;
    }

    function runFFTAnalysis(img) {
      // Canvas → grayscale Float32Array. Heavy lifting lives in analyzeGrayscale
      // so testClassifier() can feed synthetic signals through the same pipeline.
      const MAX = 512;
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      const scale = Math.min(1, MAX / Math.max(w, h));
      w = Math.max(8, Math.floor(w * scale));
      h = Math.max(8, Math.floor(h * scale));

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const { data } = ctx.getImageData(0, 0, w, h);

      const gray = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          gray[y * w + x] = (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]) / 255;
        }
      }
      return analyzeGrayscale(gray, w, h);
    }

    function analyzeGrayscale(gray, w, h) {
      // Pad to power of 2
      const size = nextPow2(Math.max(w, h));
      const real = new Float64Array(size * size);
      const imag = new Float64Array(size * size);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          real[y * size + x] = gray[y * w + x];
        }
      }

      // 2D FFT (row pass then column pass)
      const rowR = new Float64Array(size), rowI = new Float64Array(size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) { rowR[x] = real[y*size+x]; rowI[x] = imag[y*size+x]; }
        fft1d(rowR, rowI);
        for (let x = 0; x < size; x++) { real[y*size+x] = rowR[x]; imag[y*size+x] = rowI[x]; }
      }
      const colR = new Float64Array(size), colI = new Float64Array(size);
      for (let x = 0; x < size; x++) {
        for (let y = 0; y < size; y++) { colR[y] = real[y*size+x]; colI[y] = imag[y*size+x]; }
        fft1d(colR, colI);
        for (let y = 0; y < size; y++) { real[y*size+x] = colR[y]; imag[y*size+x] = colI[y]; }
      }

      // Raw + log magnitude spectra, fftshifted (DC at center)
      const rawMag = new Float64Array(size * size);
      const logMag = new Float64Array(size * size);
      const half = size / 2;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const re = real[y*size+x], im = imag[y*size+x];
          const m  = Math.sqrt(re*re + im*im);
          const sy = (y + half) % size, sx = (x + half) % size;
          rawMag[sy * size + sx] = m;
          logMag[sy * size + sx] = Math.log(1 + m);
        }
      }

      // Feature extraction
      const cx        = half;
      const cy        = half;
      const halfSize  = half;
      const maxRadius = Math.SQRT2 * halfSize;
      const innerR    = 0.10 * halfSize;
      const outerR    = 0.70 * maxRadius;

      let lowLogSum = 0, lowCount = 0;
      let highLogSum = 0, highCount = 0;
      let rawSum = 0, logRawSum = 0, totalCount = 0;
      const EPS = 1e-10;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - cx, dy = y - cy;
          if (dx === 0 && dy === 0) continue;
          const r  = Math.sqrt(dx*dx + dy*dy);
          const lm = logMag[y*size+x];
          const rm = rawMag[y*size+x];
          if (r < innerR) { lowLogSum  += lm; lowCount++;  }
          if (r > outerR) { highLogSum += lm; highCount++; }
          rawSum    += rm;
          logRawSum += Math.log(rm + EPS);
          totalCount++;
        }
      }

      const lowFreqEnergy  = lowCount  > 0 ? lowLogSum  / lowCount  : 0;
      const highFreqEnergy = highCount > 0 ? highLogSum / highCount : 0;
      const freqRatio      = highFreqEnergy / (lowFreqEnergy + 1e-9);

      const arithMean        = rawSum / Math.max(1, totalCount);
      const geoMean          = Math.exp(logRawSum / Math.max(1, totalCount));
      const spectralFlatness = geoMean / (arithMean + 1e-9);

      // Radial profile: per-ring mean log-magnitude, then slope + variance
      const RINGS = 10;
      const rSums = new Float64Array(RINGS);
      const rCnts = new Uint32Array(RINGS);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - cx, dy = y - cy;
          if (dx === 0 && dy === 0) continue;
          const r = Math.sqrt(dx*dx + dy*dy);
          const ring = Math.min(RINGS - 1, Math.floor((r / maxRadius) * RINGS));
          rSums[ring] += logMag[y*size+x];
          rCnts[ring]++;
        }
      }
      const xs = [], ys = [];
      for (let i = 0; i < RINGS; i++) {
        if (rCnts[i] < 10) continue;
        xs.push(i);
        ys.push(rSums[i] / rCnts[i]);
      }
      let radialSlope = 0;
      let radialVariance = 0;
      if (xs.length >= 2) {
        const N = xs.length;
        let sumX = 0, sumY = 0, sumXX = 0, sumXY = 0;
        for (let i = 0; i < N; i++) { sumX += xs[i]; sumY += ys[i]; sumXX += xs[i]*xs[i]; sumXY += xs[i]*ys[i]; }
        const denom = N*sumXX - sumX*sumX;
        if (denom !== 0) radialSlope = (N*sumXY - sumX*sumY) / denom;
        const meanY = sumY / N;
        let varSum = 0;
        for (let i = 0; i < N; i++) varSum += (ys[i] - meanY) * (ys[i] - meanY);
        radialVariance = Math.sqrt(varSum / N);  // stddev across rings
      }

      console.log('[FFT features]', {
        highFreqEnergy:   +highFreqEnergy.toFixed(4),
        lowFreqEnergy:    +lowFreqEnergy.toFixed(4),
        freqRatio:        +freqRatio.toFixed(4),
        spectralFlatness: +spectralFlatness.toFixed(4),
        radialSlope:      +radialSlope.toFixed(4),
        radialVariance:   +radialVariance.toFixed(4),
      });

      // Recalibrated classifier (real-world JPEG/PNG images).
      // Per-feature direction:
      //   freqRatio        HIGHER → more REAL (compression spikes HF)        [normDown]
      //   spectralFlatness HIGHER → more AI   (synthesis is flatter)          [normUp]
      //   radialSlope      HIGHER (less neg) → more AI (shallow falloff)     [normUp]
      //   radialVariance   HIGHER → more REAL (JPEG quantization bumps)      [normDown]
      // highFreqEnergy is dropped from the classifier — too noisy under JPEG.
      const normUp   = (v, lo, hi) => Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
      const normDown = (v, lo, hi) => Math.max(0, Math.min(1, (hi - v) / (hi - lo)));

      const n_freqRatio = normDown(freqRatio,        0.08, 0.45);
      const n_flatness  = normUp  (spectralFlatness, 0.15, 0.75);
      const n_radial    = normUp  (radialSlope,     -2.5, -0.2);
      const n_variance  = normDown(radialVariance,   0.05, 1.2);

      // JPEG compression correction: heavy HF energy means compression noise
      // is inflating freqRatio. Derate its contribution by 40%.
      const isJPEGCompressed = highFreqEnergy > 4.0;
      const freqRatioWeight  = isJPEGCompressed ? 0.15 * 0.6 : 0.15;

      const weightedSum =
        0.35 * n_radial +
        0.30 * n_variance +
        0.20 * n_flatness +
        freqRatioWeight * n_freqRatio;

      const aiScore = Math.max(5, Math.min(95, Math.round(weightedSum * 100)));
      const isAI    = aiScore >= 50;

      // Confidence: agreement across the 4 classifier features
      const featureVotesAI = [n_radial, n_variance, n_flatness, n_freqRatio].map(n => n >= 0.5);
      const agreeCount     = featureVotesAI.filter(v => v === isAI).length;
      const confidence     = [51, 51, 65, 82, 95][agreeCount];

      // Dominant quadrant for hotspots (mid-band energy)
      const qSums = [0,0,0,0], qCnts = [0,0,0,0];
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const dx = x - cx, dy = y - cy;
          if (dx === 0 && dy === 0) continue;
          const r = Math.sqrt(dx*dx + dy*dy);
          if (r < innerR || r > maxRadius) continue;
          const q = (y < cy ? 0 : 2) + (x < cx ? 0 : 1);
          qSums[q] += logMag[y*size+x];
          qCnts[q]++;
        }
      }
      const qMeans = qSums.map((s, i) => s / Math.max(1, qCnts[i]));
      let dominantQ = 0;
      for (let i = 1; i < 4; i++) if (qMeans[i] > qMeans[dominantQ]) dominantQ = i;

      const hotspots = generateHotspots(dominantQ, isAI);

      // MetricCard slots — each pct is "AI-likeness" 0..100 for that feature.
      // highFreqEnergy is still surfaced here even though it's no longer a
      // classifier input. Lower HF (= AI per new calibration) maps to higher pct.
      const pixelArtifactPct = Math.round(normDown(highFreqEnergy, 1.2, 7.0) * 100);
      const lightingPct      = Math.round(n_radial   * 100);
      const noisePct         = Math.round(n_flatness * 100);

      const metrics = [
        {
          label: 'Pixel Artifact Detection',
          pct: pixelArtifactPct,
          desc: isAI ? 'Smooth high-freq band — synthesis signature' : 'Compression noise + natural texture present',
          color: pixelArtifactPct >= 60 ? '#ff4757' : pixelArtifactPct >= 30 ? '#ffa502' : '#2ed573',
        },
        {
          label: 'Lighting & Shadow Coherence',
          pct: lightingPct,
          desc: isAI ? 'Shallow radial falloff — atypical' : 'Steep radial profile — physically coherent',
          color: lightingPct >= 60 ? '#ffa502' : '#2ed573',
        },
        {
          label: 'Noise Pattern Analysis',
          pct: noisePct,
          desc: isAI ? 'Flatter spectrum — synthesis signature' : 'Structured spectrum — organic noise',
          color: noisePct >= 60 ? '#ff4757' : noisePct >= 30 ? '#ffa502' : '#2ed573',
        },
        {
          label: 'Metadata Verification',
          pct: 74,
          desc: 'EXIF chain heuristic — partial verification',
          color: '#ffa502',
        },
      ];

      return {
        aiScore,
        confidence,
        metrics,
        hotspots,
        features: { highFreqEnergy, lowFreqEnergy, freqRatio, spectralFlatness, radialSlope, radialVariance },
        compressionDetected: isJPEGCompressed,
      };
    }

    function testClassifier() {
      // Temporary sanity check — runs once at script load. Two synthetic
      // signals exercise the full pipeline to confirm scores move in the
      // expected direction. Note: the spec's calibration ranges (e.g.
      // radialSlope -2.5..-1.2) are wider than what this pipeline produces
      // on any image; the test verifies *direction* of separation, not
      // absolute landing in those ranges. Tune norm() ranges with real
      // images using the [FFT features] console output.
      const SIZE = 256;

      // NATURAL: 4-octave 1/f noise. Broad-band content with strong low-freq
      // dominance and substantial per-ring variance — matches the spectral
      // signature of natural photographs.
      const natural = new Float32Array(SIZE * SIZE);
      for (let oct = 0; oct < 4; oct++) {
        const scale = Math.pow(2, oct + 1);
        const amp   = 1.0 / (oct + 1);
        const gSize = Math.ceil(SIZE / scale);
        const grid  = new Float32Array(gSize * gSize);
        for (let i = 0; i < gSize * gSize; i++) grid[i] = Math.random();
        for (let y = 0; y < SIZE; y++) {
          for (let x = 0; x < SIZE; x++) {
            const gy = Math.floor(y / scale);
            const gx = Math.floor(x / scale);
            natural[y * SIZE + x] += amp * grid[gy * gSize + gx];
          }
        }
      }

      // AI extreme: uniform white noise — flat spectrum, near-zero slope,
      // minimal radial variance. Sits at the "fully synthetic" end of the
      // spectrum direction-wise.
      const ai = new Float32Array(SIZE * SIZE);
      for (let i = 0; i < SIZE * SIZE; i++) ai[i] = Math.random();

      console.log('━━━ testClassifier sanity check ━━━');
      console.log('NATURAL (1/f noise) — expected aiScore < 50:');
      const rn = analyzeGrayscale(natural, SIZE, SIZE);
      console.log('  → aiScore:', rn.aiScore, '| confidence:', rn.confidence, '| compressionDetected:', rn.compressionDetected);
      console.log('AI (white noise) — expected aiScore > 50:');
      const ra = analyzeGrayscale(ai, SIZE, SIZE);
      console.log('  → aiScore:', ra.aiScore, '| confidence:', ra.confidence, '| compressionDetected:', ra.compressionDetected);
      const passDir = rn.aiScore < ra.aiScore && rn.aiScore < 50 && ra.aiScore > 50;
      console.log('Directional check:', passDir ? 'PASS' : 'FAIL', '(gap: ' + (ra.aiScore - rn.aiScore) + ' pts)');
      console.log('━━━ end testClassifier ━━━');
    }

    // Run sanity check once when the script first loads
    try { testClassifier(); } catch (e) { console.warn('testClassifier failed:', e); }

    function analyzeImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          try {
            const result = runFFTAnalysis(img);
            URL.revokeObjectURL(url);
            resolve(result);
          } catch (err) {
            URL.revokeObjectURL(url);
            reject(err);
          }
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image load failed')); };
        img.src = url;
      });
    }

    /* ── IMAGE HEATMAP ── */
    function ImageHeatmap({ imageUrl, isAI, customHotspots }) {
      const canvasRef = useRef(null);
      const [view, setView] = useState('heatmap');
      const hotspots = customHotspots && customHotspots.length
        ? customHotspots
        : (isAI ? AI_HOTSPOTS : HUMAN_HOTSPOTS);

      const drawHeatmap = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.offsetWidth || 600, H = canvas.offsetHeight || 360;
        canvas.width = W; canvas.height = H;
        ctx.clearRect(0, 0, W, H);
        hotspots.forEach(({ x, y, r, intensity }) => {
          const cx = x * W, cy = y * H, radius = r * Math.min(W, H);
          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
          if (isAI) {
            grad.addColorStop(0,    `rgba(255,40,40,${intensity*0.82})`);
            grad.addColorStop(0.3,  `rgba(255,120,20,${intensity*0.55})`);
            grad.addColorStop(0.65, `rgba(255,210,0,${intensity*0.28})`);
            grad.addColorStop(1,    `rgba(255,210,0,0)`);
          } else {
            grad.addColorStop(0,   `rgba(46,213,115,${intensity*0.7})`);
            grad.addColorStop(0.5, `rgba(0,200,200,${intensity*0.35})`);
            grad.addColorStop(1,   `rgba(0,200,200,0)`);
          }
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
        });
      }, [isAI, hotspots]);

      useEffect(() => { if (view === 'heatmap') requestAnimationFrame(drawHeatmap); }, [view, drawHeatmap]);

      const pinColor = isAI ? '#ff4757' : '#2ed573';
      return (
        <div className="heatmap-section anim-fade-up anim-delay-2">
          <div className="heatmap-header">
            <p className="metrics-title" style={{ margin: 0 }}>Image Preview &amp; Artifact Heatmap</p>
            <div className="heatmap-toggle">
              <button className={`toggle-btn ${view === 'original' ? 'active' : ''}`} onClick={() => setView('original')}>Original</button>
              <button className={`toggle-btn ${view === 'heatmap'  ? 'active' : ''}`} onClick={() => setView('heatmap')}>Heatmap</button>
            </div>
          </div>
          <div className="heatmap-image-wrap">
            {imageUrl
              ? <img src={imageUrl} className="heatmap-img" alt="Analyzed file" />
              : <div className="heatmap-placeholder"><span style={{ fontSize: '32px' }}>🖼️</span><span>No image preview — non-image file analyzed</span></div>
            }
            {view === 'heatmap' && <canvas ref={canvasRef} className="heatmap-canvas" />}
            {view === 'heatmap' && hotspots.map((h, i) => (
              <div key={i} className="hotspot-pin" style={{ left: `${h.x*100}%`, top: `${h.y*100}%`, animationDelay: `${i*0.1+0.3}s` }}>
                <div className="hotspot-ring" style={{ borderColor: pinColor, boxShadow: `0 0 8px ${pinColor}88` }}/>
                <span className="hotspot-label-text" style={{ color: pinColor, border: `1px solid ${pinColor}44` }}>{h.label}</span>
              </div>
            ))}
          </div>
          <div className="heatmap-legend">
            {isAI ? (
              <>
                <div className="legend-item"><span className="legend-dot" style={{ background: '#ff4757' }}/>High-risk zone</div>
                <div className="legend-item"><span className="legend-dot" style={{ background: '#ffa502' }}/>Moderate anomaly</div>
                <div className="legend-item"><span className="legend-dot" style={{ background: '#ffd700' }}/>Low-confidence region</div>

              <>
                <div className="legend-item"><span className="legend-dot" style={{ background: '#2ed573' }}/>Authentic region</div>
                <div className="legend-item"><span className="legend-dot" style={{ background: '#00f5ff' }}/>Minor compression artifact</div>
              </>

            <div className="legend-item" style={{ marginLeft: 'auto' }}>
              <span style={{ color: 'var(--text-muted)', fontSize: '11px' }}>{hotspots.length} region{hotspots.length !== 1 ? 's' : ''} flagged</span>

      );

    /* ── ROOT APP ── */
    function App() {
      const [phase, setPhase] = useState('idle');
      const [uploadCount, setUploadCount] = useState(0);
      const [filename, setFilename] = useState('');
      const [imageUrl, setImageUrl] = useState(null);
      const [mode, setMode] = useState('prototype');
      const [analysis, setAnalysis] = useState(null);
      const [productionNote, setProductionNote] = useState(null);
      const [activeTab, setActiveTab] = useState(() => {
        const p = new URLSearchParams(window.location.search);
        return p.get('tab') || 'home';
      });

      const handleUpload = async (file) => {
        setFilename(file ? file.name : 'sample_file.jpg');
        setUploadCount(prev => prev + 1);
        setPhase('scanning');
        setAnalysis(null);
        setProductionNote(null);

        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => setImageUrl(e.target.result);
          reader.readAsDataURL(file);
        } else {
          setImageUrl(null);
        }

        const isImage = file && file.type.startsWith('image/');
        const minScan = new Promise(r => setTimeout(r, 2200));

        if (mode === 'production' && isImage) {
          try {
            const [result] = await Promise.all([analyzeImage(file), minScan]);
            setAnalysis(result);
          } catch (err) {
            console.error('FFT analysis failed', err);
            await minScan;
            setProductionNote('FFT analysis failed — falling back to prototype heuristics');
          }
          setPhase('results');
        } else {
          if (mode === 'production' && file && !isImage) {
            setProductionNote('Frequency analysis requires an image file');
          }
          await minScan;
          setPhase('results');
        }
      };

      const handleReset = () => {
        setPhase('idle');
        setFilename('');
        setImageUrl(null);
        setAnalysis(null);
        setProductionNote(null);
      };

      const productionSteps = mode === 'production' ? PRODUCTION_SCAN_STEPS : SCAN_STEPS;

      return (
        <>
          <GooeyFilter/>
          <header className="header">
            <a className="header-logo" href="index.html" style={{ textDecoration: 'none' }}>
              <div className="header-icon">
                <img src="logo.png" alt="Project Faith" style={{ width: '26px', height: '26px', objectFit: 'contain' }}/>
              </div>
              <span className="header-title">Faith &nbsp;|&nbsp; Authentic Verification</span>
            </a>
            <div className="header-actions">
              <ModeToggle mode={mode} onChange={setMode}/>
              <a className="header-back" href="index.html">← Home</a>
            </div>
          </header>

          <main className="main">
            {phase === 'idle' && (
              <>
                <GradientMenu activeTab={activeTab} onTabChange={setActiveTab}/>
                <UploadZone uploadCount={uploadCount} onUpload={handleUpload} activeTab={activeTab} mode={mode}/>
              </>
            )}

            {phase === 'scanning' && (
              <div className="glass-card anim-fade-up">
                <ScanPanel filename={filename} steps={productionSteps}/>
              </div>
            )}

            {phase === 'results' && (
              <div className="glass-card anim-fade-up">
                <ResultsPanel
                  uploadCount={uploadCount}
                  onReset={handleReset}
                  imageUrl={imageUrl}
                  analysis={analysis}
                  productionNote={productionNote}
                />
              </div>
            )}

            <footer className="footer">
              <span>Project Faith</span> · Forensic AI Detection Engine ·
              All analysis performed client-side. No data is uploaded to external servers.
            </footer>
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
